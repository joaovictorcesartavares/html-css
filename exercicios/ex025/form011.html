<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de inputmode</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="icpf">CPF</label>
            <input type="text" name="cpf" id="icpf" inputmode="numeric" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" required>
        </p>
        
        <p>
            <label for="iusu">Nome de Usuário</label>
            <input type="email" name="usu" id="isu" inputmode="email" autocomplete="email">
        </p>
        
        <p>
            <label for="idec">Valor decimal</label>
            <input type="text" name="dec" id="idec" inputmode="decimal">
        </p>

        <p>
            <label for="itel">Telefone</label>
            <input type="tel" name="tel" id="itel" inputmode="tel" autocomplete="tel">
        </p>

        <p>
            <label for="isearch">Pesquisar</label>
            <input type="search" name="search" id="isearch" inputmode="search">
        </p>

        <p>
            <label for="iurl">URL</label>
            <input type="url" name="url" id="iurl" inputmode="url" autocomplete="url">
        </p>

        <p>
            <label for="inone">None</label>
            <input type="text" name="none" id="inone">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
