<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Meu Primeiro Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off"> 
        <!--
        Esse autocomplete="off", tira aquela sugestão de nomes ja utilizado antes e etc.

        ja o action, é pra onde as informações vão ser enviadas quando clicamos no botão de submit, nesse caso, para o arquivo php.
        --> 
        <p>
            <label for="inome">Nome:</label> 
            <!--O label, cria uma relação entre o texto e o campo de entrada (entre a palavra{nome} e o objeto{input})-->
            <input type="text" name="nome" id="inome">
        </p>
        <p>
            <label for="isobrenome">Sobrenome:</label>
            <input type="text" name="sobrenome" id="isobrenome">
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
