<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframes</title>
</head>
<style>
    iframe{
        width: 400px;
        height: 400px;
    }
</style>
<body>

    <!--
    Entre a configuração CSS inline(dentro do iframe) e a configuração CSS interna ou externa.

    A interna ou externa prevalece sobre a inline.
    -->



    <h1>Testando o uso de iframes</h1>
    <!--Tamanho padrão dos iframes: 300x150-->
    <p>
        Acesse o site do
        <iframe src="https://www.cursoemvideo.com/" frameborder="0"  width="500px" height="500px" scrolling="auto">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe>   <!-- Esse link só vai aparecer causo o dispositivo não seja compatível com iframe -->
        e estude muitos cursos!
    </p>

    <p>
        O repositório do Guanabara
        <iframe src="https://gustavoguanabara.github.io/" frameborder="0" width="500px" height="500px" scrolling="auto">
            <a href="https://gustavoguanabara.github.io/" target="_blank">Guanabara's Repository</a> <!-- Esse link só vai aparecer causo o dispositivo não seja compatível com iframe -->
        </iframe>
        também é bem legal.
    </p>
</body>
</html>
