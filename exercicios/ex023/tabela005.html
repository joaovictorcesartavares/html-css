<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colgroup Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
        }

        th, td{
            border: 1px solid black;
            padding: 8px;
        }

        .destaque1{
            background-color: aqua;
        }

        .destaque2{
            background-color: blue;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="destaque1" span="2">
            <col class="destaque2" span="2">
        </colgroup>

        <caption>Cadastro</caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Victor</td>
            <td>M</td>
            <td>19</td>
            <td>Programador</td>
        </tr>

        <tr>
            <td>Aline</td>
            <td>F</td>
            <td>18</td>
            <td>Secretária</td>
        </tr>

        <tr>
            <td>Marcio</td>
            <td>M</td>
            <td>18</td>
            <td>Garí</td>
        </tr>

        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>40</td>
            <td>Professor</td>
        </tr>
        
    </table>
</body>
</html>
